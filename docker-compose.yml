# Face Recognition Service stack.
#
#   docker compose up -d rabbitmq
#   docker compose up -d --build app
#
# The app container enrols employee photos from EMPLOYEE_PHOTOS_SOURCE in the
# background and starts the camera if CAMERA_AUTOSTART=true. There is no database to
# migrate: enrolment embeddings are cached under STORAGE_PATH.

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # rabbitmq-diagnostics boots a full Erlang VM per probe (~15s on a modest
      # host), so a 5s timeout never passes -- and probes fired every 5s overlap
      # and starve the broker while it boots. A TCP probe of the AMQP port is
      # what `app` actually depends on, and costs ~50ms.
      test: ["CMD-SHELL", "nc -z localhost 5672 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  app:
    build: .
    env_file:
      - .env
    environment:
      # Must be real env vars: the cv2 DLL reads them at process start, so setting
      # them from Python is too late. Without these an RTSP feed logs a line per
      # dropped packet to stderr. See app/core/logging.py.
      OPENCV_LOG_LEVEL: ERROR
      OPENCV_FFMPEG_LOGLEVEL: "8"
      ATTENDANCE_MQ_URL: amqp://guest:guest@rabbitmq:5672/
      STORAGE_PATH: /data/storage
      MODELS_DIR: /data/models
    volumes:
      - ${EMPLOYEE_PHOTOS_SOURCE:-./uploads/employees}:/data/uploads:ro
      # Writable, and deliberately not inside the appdata volume: the ~275 MB
      # model pack is then downloaded once and survives `docker compose down -v`.
      - ./models:/data/models
      - appdata:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  rabbitmqdata:
  appdata:
