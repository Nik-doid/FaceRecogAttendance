[project]
name = "face-recognition-service"
version = "0.1.0"
description = "Production-ready face recognition service for RTSP cameras reporting attendance events to an existing system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "opencv-python-headless>=4.9,<5.0",
    "numpy>=1.26,<3.0",
    "pika>=1.3,<2.0",
    "PyJWT>=2.8,<3.0",
    "prometheus-client>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "Pillow>=10.3,<12.0",
    "PyMySQL>=1.1,<2.0",
    # faiss is part of the core pipeline (in-memory embedding index) and has plain
    # Windows/manylinux wheels, so it lives in base deps rather than the ai extra.
    "faiss-cpu>=1.8,<2.0",
]

[project.optional-dependencies]
# Heavy AI inference dependencies. Kept in a separate extra so the control plane
# (FastAPI + DB + worker plumbing) can be tested/deployed on machines without GPU
# or before model wheels are available. The Docker image installs them via --extra ai.
ai = [
    "onnxruntime>=1.18,<2.0",
    "insightface>=0.7.3,<1.0",
]
# Local debugging / ops UI (Streamlit). Not installed by the service Docker image.
frontend = [
    "streamlit>=1.36,<2.0",
    "requests>=2.32,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "aiosqlite>=0.20,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
